[package]
name = "f2"
description = "Official crate for the ff language"
authors = ["Zihan Jin"]
license = "Unlicense"
repository = "https://github.com/zjom/ff"
version = "0.1.6"
edition = "2024"

[dependencies]
pest = "2.8"
pest_derive = "2.8"
anyhow = "1"
lazy_static = "1.4"
rug = { version = "1.27", default-features = false, features = ["rational"] }
rustyline = { version = "18.0.0", features = ["derive"] }
bon = "3.9.1"
clap = { version="4.6.1", features = ["derive"] }
im = "15"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
ureq = "2"
